# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 靖翼之憩
subtitle: '挫其锐解其纷，和其光同其尘'
description: '靖翼子的个人博客 — 记录科研日常'
keywords:
author: 靖翼子
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://jingyizi.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - 'index.html'      # 手写首页，不经过 Hexo 渲染
  - 'GUIDE.md'        # 维护指南
  - 'GISStory/**'     # 旧 GIS 可视化页面
  - '2023/**'         # 旧文章页面

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
filename_case: 0
render_drafts: false
post_asset_folder: false
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
prismjs:
  enable: false

# Home page setting (disabled — custom source/index.html is used instead)
index_generator:
  enable: false

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: next

# Deployment (handled by GitHub Actions — see .github/workflows/deploy.yml)
